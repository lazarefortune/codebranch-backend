services:
  db:
    image: mysql:8.0
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codebranch}
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata: